# Lapras (local development) overrides
# All infrastructure uses ephemeral storage (in-memory, fast, no persistence)

# Disable secrets management (use local secrets instead)
bromine:
  enable: false

databases:
  main:
    enabled: true
    ephemeral: true # Fast local dev, data lost on restart
    instances: 1
    storage:
      size: 1Gi

  # Example: Add a secondary database if needed
  # secondary:
  #   enabled: true
  #   ephemeral: true
  #   database: arene-zinc-secondary
  #   instances: 1

caches:
  main:
    enabled: true
    ephemeral: true # Pure in-memory, no RDB/AOF
    replicas: 1

  # Example: Add session cache
  # session:
  #   enabled: true
  #   ephemeral: true
  #   replicas: 1

storages:
  main:
    enabled: true
    ephemeral: true # emptyDir, data lost on restart
    pools:
      servers: 1
      volumesPerServer: 1

  # Example: Add user uploads storage
  # uploads:
  #   enabled: true
  #   ephemeral: true
  #   pools:
  #     servers: 1
  #     volumesPerServer: 1
