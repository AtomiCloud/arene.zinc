# Example values for testing external infrastructure locally (absol)
# Use this to test cloud service configurations before deploying to production

serviceTree: &serviceTree
  landscape: absol
  platform: arene
  service: &service zinc
  layer: '2'

tags: &tags
  atomi.cloud/platform: arene
  atomi.cloud/service: zinc
  atomi.cloud/layer: '2'

bromine:
  serviceTree:
    <<: *serviceTree
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  storeName: *service
  rootSecret:
    name: *service
    ref:
      clientId: ARENE_ZINCCLIENT_ID
      clientSecret: ARENE_ZINCCLIENT_SECRET
  target: &target zinc

api:
  enabled: true
  annotations:
    argocd.argoproj.io/sync-wave: '4'
    argocd.argoproj.io/hook: Sync
    drop_log: 'true'
  nameOverride: 'zinc-api'
  envFromSecret: *target
  serviceTree:
    <<: *serviceTree
    module: api
  imagePullSecrets: []
  replicaCount: 1
  appSettings:
    App:
      Mode: Server
  configMountPath: /app/Config
  image:
    repository: arene-zinc-api
    pullPolicy: IfNotPresent
    tag: ''
  serviceAccount:
    create: false
    annotations: {}
    name: ''
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 80
    containerPort: 9000
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api.zinc.arene.absol.lvh.me
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: sample
        issuerRef: sample
        hosts:
          - api.zinc.arene.absol.lvh.me
  resources:
    limits:
      cpu: '1'
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling: {}
  readinessProbe:
    periodSeconds: 30
    httpGet:
      path: /
      port: http
  livenessProbe:
    periodSeconds: 30
    httpGet:
      path: /
      port: http
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: {}

migration:
  annotations:
    argocd.argoproj.io/sync-wave: '3'
    argocd.argoproj.io/hook: Sync
    drop_log: 'true'
  enabled: false
  nameOverride: 'zinc-migration'
  envFromSecret: *target
  serviceTree:
    <<: *serviceTree
    module: migration
  aspNetEnv: Development
  appSettings:
    App:
      Mode: Migration
  backoffLimit: 4
  configMountPath: /app/Config
  image:
    repository: arene-zinc-migration
    pullPolicy: IfNotPresent
    tag: ''
  imagePullSecrets: []
  serviceAccount:
    create: false
    annotations: {}
    name: ''
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: {}

# External Database (e.g., Neon, RDS)
maindb:
  enable: true
  type: external
  external:
    host: ${NEON_HOST} # Set via environment variable
    port: 5432
    database: arene-zinc
    sslMode: require
  secretRef:
    name: zinc-maindb-credentials
    keys:
      username: username
      password: password

# External Cache (e.g., Redis Cloud, ElastiCache)
maincache:
  enable: true
  type: external
  external:
    host: ${REDIS_HOST} # Set via environment variable
    port: 6379
    tls: true
  secretRef:
    name: zinc-maincache-credentials
    keys:
      password: password

# External Object Storage (e.g., R2, S3)
mainstorage:
  enable: true
  type: external
  external:
    endpoint: ${S3_ENDPOINT} # Set via environment variable (e.g., https://r2.cloudflare.com)
    region: auto
    bucket: zinc-test-files
  secretRef:
    name: zinc-mainstorage-credentials
    keys:
      accessKey: accessKey
      secretKey: secretKey
