serviceTree:
  landscape: &landscape tauros

bromine:
  enable: true
  serviceTree:
    landscape: *landscape

api:
  enabled: true

  fullnameOverride: 'zinc-api'
  serviceTree:
    landscape: *landscape

  imagePullSecrets: []

  replicaCount: 1

  configMountPath: /app/Config

  service:
    type: ClusterIP
    port: 80
    containerPort: 9030

  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: api.zinc.arene.tauros.lvh.me
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

migration:
  enabled: true
  fullnameOverride: 'zinc-migration'
  serviceTree:
    landscape: *landscape

databases:
  main:
    enabled: true
    type: crd
    ephemeral: false # Persistent storage for integration testing
    instances: 1
    storage:
      size: 5Gi
      storageClass: local-path

caches:
  main:
    enabled: true
    type: crd
    ephemeral: false # Persistent cache for integration testing
    replicas: 1

storages:
  main:
    enabled: true
    type: crd
    ephemeral: false # Persistent storage for integration testing
    pools:
      servers: 1
      volumesPerServer: 1
    storage:
      size: 5Gi
      storageClass: local-path
    ingress:
      enabled: true
      className: traefik
      console:
        host: console-mainstorage.zinc.arene.tauros.lvh.me
      api:
        host: mainstorage.zinc.arene.tauros.lvh.me
