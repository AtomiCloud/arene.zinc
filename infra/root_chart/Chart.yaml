apiVersion: v2
name: root-chart
description: Root Chart for arene zinc

type: application
version: 0.1.0
appVersion: '1.16.0'

dependencies:
  # Root Chart
  - name: dotnet-chart
    version: 0.1.0
    repository: file://../api_chart
    condition: api.enabled
    alias: api
  # Migration
  - name: dotnet-migration
    version: 0.1.0
    repository: file://../migration_chart
    condition: migration.enabled
    alias: migration

  # Secrets
  - name: sulfoxide-bromine
    version: 1.8.0
    condition: bromine.enable
    alias: bromine
    repository: oci://ghcr.io/atomicloud/sulfoxide.bromine

  # Infrastructure (postgres, cache, storage) now deployed as CRDs via templates/
  # - CloudNativePG Cluster for PostgreSQL (templates/maindb-cluster.yaml)
  # - Dragonfly CRD for cache (templates/maincache-dragonfly.yaml)
  # - MinIO Tenant for storage (templates/mainstorage-tenant.yaml)
