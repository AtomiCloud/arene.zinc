{{- range $name, $db := .Values.databases }}
{{- if and $db.enabled (eq $db.type "crd") }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "root-chart.fullname" $ }}-{{ $name }}db
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "root-chart.labels" $ | nindent 4 }}
spec:
  instances: {{ $db.instances | default 1 }}

  {{- if $db.ephemeral }}
  # Ephemeral storage - emptyDir (in-memory, data lost on pod restart)
  ephemeralVolumeSource:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $db.storage.size | default "1Gi" }}
        volumeMode: Filesystem
  {{- else }}
  # Persistent storage
  storage:
    size: {{ $db.storage.size | default "10Gi" }}
    {{- if $db.storage.storageClass }}
    storageClass: {{ $db.storage.storageClass }}
    {{- end }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ $db.database | default "app" }}
      owner: app
      secret:
        name: {{ $db.secretRef.name | default (printf "%s-%sdb-credentials" (include "root-chart.fullname" $) $name) }}

  {{- if and $db.backup $db.backup.enabled }}
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/{{ include "root-chart.fullname" $ }}-{{ $name }}db
      {{- if $db.backup.s3Credentials }}
      s3Credentials:
        {{- toYaml $db.backup.s3Credentials | nindent 8 }}
      {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.secretRef.name | default (printf "%s-%sdb-credentials" (include "root-chart.fullname" $) $name) }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  username: app
  password: supersecret
  {{- if $db.secretRef.keys.connectionString }}
  {{ $db.secretRef.keys.connectionString }}: "Host={{ include "root-chart.fullname" $ }}-{{ $name }}db-rw.{{ $.Release.Namespace }}.svc.cluster.local;Port=5432;Database={{ $db.database | default "app" }};Username=app;Password=supersecret"
  {{- end }}
{{- end }}
{{- end }}
