version: '3'

tasks:
  default:
    desc: Stop zinc development (keeps infrastructure running)
    cmds:
      - ./scripts/local/stop.sh

  platform:
    desc: Stop platform operators (CloudNativePG, MinIO, Dragonfly)
    cmds:
      - ./scripts/local/stop-platform.sh

  all:
    desc: Stop everything (zinc + platform operators)
    cmds:
      - task: stop:default
      - task: stop:platform
