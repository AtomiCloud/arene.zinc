$schema: ./schema.json
# Test configuration for integration tests
AllowedHosts: '*'
Kestrel:
  Endpoints:
    Http:
      Url: http://+:9004

App:
  Landscape: tauros
  Platform: arene
  Service: zinc
  Module: api
  Mode: Server
  DefaultCors: AllowAll
  Version: 1.0.0
  EnableSwagger: false
  GenerateConfig: false

ErrorPortal:
  Enabled: false
  EnableExceptionResponse: true

Cors:
  - Name: AllowAll
    PreflightMaxAge: 600
    AllowedOrigins: ['*']
    AllowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
    AllowedHeaders: ['*']
    AllowCredentials: false

# Disable OTEL for tests
Logs:
  Exporter:
    Console:
      Enabled: false
    Otlp:
      Enabled: false

Trace:
  Instrument:
    EFCore:
      Enabled: false
    AspNetCore:
      Enabled: false
    HttpClient:
      Enabled: false
    SqlClient:
      Enabled: false
  Exporter:
    Console:
      Enabled: false
    Otlp:
      Enabled: false

Metric:
  Meter:
    AspNetCore:
      Enabled: false
    HttpClient:
      Enabled: false
    System:
      Enabled: false
  Exporter:
    Console:
      Enabled: false
    Otlp:
      Enabled: false

# Auth - minimal config for tests
Auth:
  Enabled: false
  Settings:
    Endpoint: http://localhost
    AppId: test-app
    AppSecret: test-secret
    Policies: {}
    Scopes: []

# Database - will be overridden by in-memory DB in tests
Database:
  MAIN:
    ConnectionString: 'InMemory'
    AutoMigrate: false
    MaxRetries: 0
    CommandTimeout: 30

# No external services in tests
BlockStorage: {}
Cache: {}
HttpClient: {}
Smtp: {}
