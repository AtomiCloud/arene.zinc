version: '3'

vars:
  CHART_PATH: infra/root_chart
  RELEASE_NAME: arene-zinc

includes:
  helm: Taskfile.helm.yaml
  tear: tasks/Taskfile.tear.yaml
  stop: tasks/Taskfile.stop.yaml
  cluster: tasks/Taskfile.cluster.yaml
  k6: tasks/Taskfile.k6.yaml
  util: tasks/Taskfile.util.yaml
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      TEST_DIR: UnitTest
      TARGET: Domain
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      TEST_DIR: IntTest
      TARGET: Domain,App
    env:
      LANDSCAPE: tauros

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '0'
  SOS_PROJECT_ID: '1cffa31e-7653-4c0d-9a18-9914a2dbc30b'

tasks:
  gen:encryption-key:
    desc: Generate encryption key
    cmds:
      - openssl rand -hex 16
  lint:
    desc: Lint the repository
    cmds:
      - pre-commit run --all
  email:dev:
    desc: Preview Emails
    dir: App/Templates/Email
    cmds:
      - bun run dev
  email:build:
    desc: Build Emails
    dir: App/Templates/Email
    cmds:
      - bun run email export -p --outDir templates
  migration:create:
    desc: Creates a migration
    env:
      LANDSCAPE: lapras
    cmds:
      - dotnet ef migrations --project ./App add {{.CLI_ARGS}}
  run:
    desc: Runs local .NET Server
    env:
      LANDSCAPE: corsola
    cmds:
      - dotnet run --project App
  setup:
    desc: 'Setup the repository'
    cmds:
      - dotnet restore --use-lock-file
      - dotnet tool restore
      - ./scripts/local/secrets.sh
      - bun install --cwd=./App/Templates/Email
  build:
    desc: Builds application
    cmds:
      - dotnet build --no-restore
  tear:
    desc: Tear down the local development cluster
    cmds:
      - ./scripts/local/tear.sh
  exec:
    desc: Starts any application in the cluster
    cmds:
      - ./scripts/local/exec.sh ./config/dev.yaml {{.CLI_ARGS}}
  dev:
    desc: Start development with Garden + DNS proxy (hot reload)
    cmds:
      - ./scripts/local/dev.sh

  dns-proxy:
    desc: Start DNS proxy for cluster services (gives you cluster DNS access)
    cmds:
      - ./scripts/local/dns-proxy.sh arene k3d-lapras

  stop:
    desc: Stop zinc development (keeps infrastructure running)
    cmds:
      - ./scripts/local/stop.sh

  latest:
    desc: Get the latest versions of dependencies
    cmds:
      - task: util:latest-oci
        vars:
          NAME: bromine
          OCI: ghcr.io/atomicloud/sulfoxide.bromine/sulfoxide-bromine
      - task: util:latest-oci
        vars:
          NAME: postgres
          OCI: registry-1.docker.io/bitnamicharts/postgresql
      - task: util:latest-oci
        vars:
          NAME: minio
          OCI: registry-1.docker.io/bitnamicharts/minio
      - task: util:latest-oci
        vars:
          NAME: dragonfly
          OCI: ghcr.io/dragonflydb/dragonfly/helm/dragonfly
  'auth:token':
    desc: Obtain Auth token via M2M semantics
    cmds:
      - ./scripts/local/auth-token.sh ./config/dev.yaml {{.CLI_ARGS}}

  preview:
    desc: Create preview environment with production data (Neon + Tigris branches)
    env:
      LANDSCAPE: absol
    cmds:
      - ./scripts/preview/create-branches.sh

  'preview:down':
    desc: Tear down preview environment and delete branches
    cmds:
      - ./scripts/preview/delete-branches.sh
