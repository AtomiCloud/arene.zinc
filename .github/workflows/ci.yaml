name: CI

on:
  push:

jobs:
  precommit:
    name: Pre-Commit
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit
    with:
      atomi_platform: arene
      atomi_service: zinc
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/⚡reusable-tests.yaml
    secrets: inherit
    with:
      atomi_platform: arene
      atomi_service: zinc
      test_dir: UnitTest
      target: Domain
  build-api:
    name: Build API Image
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      atomi_platform: arene
      atomi_service: zinc

      dockerfile: ./infra/Dockerfile
      image_name: api
  build-migrate:
    name: Build Migration Image
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      atomi_platform: arene
      atomi_service: zinc

      dockerfile: ./infra/migrate.Dockerfile
      image_name: migrate
  helm:
    name: Helm Chart
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      atomi_platform: arene
      atomi_service: zinc
      chart_path: ./infra/root_chart
